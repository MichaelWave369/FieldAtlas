name: Validate Field Atlas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Inventory live public Pages (network failures retain safe fallback)
        run: npm run catalog:sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - name: Static Grand Opening preflight (not manual acceptance)
        run: npm run launch:preflight
      - name: Report manual release gate (pending is not a failure of PR checks)
        run: npm run release:status
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile-emulated browser journeys
        run: npm run test:e2e
      - name: Capture visitor acceptance packet (automatic checks do not approve a release)
        if: always()
        run: npm run acceptance:packet
      - name: Check current public GitHub Pages behavior (baseline, not candidate approval)
        run: npm run test:live
      - name: Upload browser QA and acceptance packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-atlas-browser-qa
          path: |
            release-evidence/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
