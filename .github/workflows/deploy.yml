name: Deploy The Field Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *' # Daily UTC refresh; only public verified sites enter the book
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Refresh public GitHub Pages catalog
        run: npm run catalog:sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - name: Static Grand Opening preflight (no DNS changes)
        run: npm run launch:preflight
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Verify actual public GitHub Pages deployment
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Confirm HTTP resources and exact deployed commit
        run: npm run live:verify -- --output=live-http-evidence.json
      - name: Install Chromium for post-deploy visitor checks
        if: success()
        run: npx playwright install --with-deps chromium
      - name: Test the actual public book in desktop and mobile emulation
        if: success()
        run: npm run test:live
      - name: Retain read-only post-deploy evidence and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-atlas-live-deployment-evidence
          path: |
            live-http-evidence.json
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
